<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="124" viewBox="0 0 1000 124" role="img" aria-labelledby="title desc"><title id="title">Chapter 04: Power Level</title><desc id="desc">Power Level (Chỉ số sức mạnh)</desc><defs><style>@font-face{font-family:KatminBangers;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:KatminHand;src:url(data:font/woff2;base64,) format('woff2')}.b{font-family:KatminBangers,Impact,'Arial Black',sans-serif}.h{font-family:KatminHand,'Comic Sans MS','Chalkboard SE',cursive}
.o{paint-order:stroke;stroke-linejoin:round;stroke-linecap:round}
.spin,.spin-slow,.pulse,.wiggle,.pop-in{transform-box:fill-box;transform-origin:center}
.spin{animation:spin 50s linear infinite}
.spin-slow{animation:spin 120s linear infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.bob{animation:bob 2.6s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.twinkle{animation:twinkle 2.2s ease-in-out infinite}
.steam{animation:steam 2.4s ease-in infinite}
.slide{animation:slide 1.1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.08) rotate(-4deg)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes steam{0%{transform:translateY(8px);opacity:0}40%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
@keyframes slide{from{transform:translateX(720px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><pattern id="ht" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="5.5" cy="5.5" r="2.4" fill="#16120F"/></pattern></defs><polygon points="126.218,28 622.38,28 600.38,104 104.218,104" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/><polygon points="134.21800000000002,36 630.38,36 608.38,112 112.218,112" fill="#16120F"/><polygon points="126.218,28 622.38,28 600.38,104 104.218,104" fill="#FFD23F"/><polygon points="126.218,28 622.38,28 600.38,104 104.218,104" fill="url(#ht)" opacity="0.13"/><polygon points="126.218,28 622.38,28 600.38,104 104.218,104" fill="none" stroke="#16120F" stroke-width="5" stroke-linejoin="round"/><text class="b" font-size="54" x="140.21800000000002" y="86" fill="#16120F" letter-spacing="1.5">POWER LEVEL</text><text class="h" font-size="26" x="391.09" y="84" fill="#16120F" opacity="0.72">— Chỉ số sức mạnh</text><g transform="translate(20 16) rotate(-6)"><rect x="-4" y="-4" width="108.218" height="58" rx="0" fill="#FFFFFF"/><rect x="5" y="5" width="100.218" height="50" fill="#16120F"/><rect x="0" y="0" width="100.218" height="50" fill="#EF3E36" stroke="#16120F" stroke-width="4"/><text class="b o" font-size="34" x="50.109" y="38" text-anchor="middle" letter-spacing="1" fill="#FFFFFF" stroke="#16120F" stroke-width="5">CH.04</text></g><g transform="translate(816.19 66) rotate(-5)"><g class="wiggle"><text class="b o" font-size="50" x="0" y="18" text-anchor="middle" letter-spacing="1" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="19">IT'S OVER 9000?!</text><text class="b o" font-size="50" x="0" y="18" text-anchor="middle" letter-spacing="1" fill="#FF6FB5" stroke="#16120F" stroke-width="9">IT'S OVER 9000?!</text></g></g></svg>
