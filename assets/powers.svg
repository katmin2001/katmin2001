<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img" aria-labelledby="title desc"><title id="title">Super powers — tech stack</title><desc id="desc">Main weapons: Java, Spring Boot, JavaScript, Vue.js. Sidekick skills: Python, Odoo, C++, HTML / CSS, Git. Secret techniques: Chrome Extensions, AI Agents, Canvas Games, PowerShell</desc><defs><style>@font-face{font-family:KatminBangers;src:url(data:font/woff2;base64,) format('woff2')}.b{font-family:KatminBangers,Impact,'Arial Black',sans-serif}.h{font-family:KatminHand,'Comic Sans MS','Chalkboard SE',cursive}
.o{paint-order:stroke;stroke-linejoin:round;stroke-linecap:round}
.spin,.spin-slow,.pulse,.wiggle,.pop-in{transform-box:fill-box;transform-origin:center}
.spin{animation:spin 50s linear infinite}
.spin-slow{animation:spin 120s linear infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.bob{animation:bob 2.6s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.twinkle{animation:twinkle 2.2s ease-in-out infinite}
.steam{animation:steam 2.4s ease-in infinite}
.slide{animation:slide 1.1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.08) rotate(-4deg)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes steam{0%{transform:translateY(8px);opacity:0}40%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
@keyframes slide{from{transform:translateX(720px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><pattern id="ht" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="5.5" cy="5.5" r="2.4" fill="#16120F"/></pattern><linearGradient id="corner-g" x1="1" y1="0" x2="0.4" y2="0.8"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="corner" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#corner-g)"/></mask></defs><rect width="1000" height="358" rx="10" fill="#FFFFFF"/><rect x="8" y="8" width="984" height="342" fill="#FFF7E3" stroke="#16120F" stroke-width="5"/><rect x="8" y="8" width="984" height="342" fill="url(#ht)" mask="url(#corner)" opacity="0.16"/><g transform="translate(34 44) rotate(-3)"><rect x="0" y="0" width="188.592" height="44" fill="#16120F" stroke="#16120F" stroke-width="3"/><text class="b" font-size="22" x="94.296" y="30" text-anchor="middle" fill="#FFD23F" letter-spacing="1">MAIN WEAPONS</text></g><g transform="translate(343.1 66) rotate(0.6)"><rect x="-34.196" y="-21" width="78.392" height="52" rx="10" fill="#16120F"/><rect x="-39.196" y="-26" width="78.392" height="52" rx="10" fill="#EF3E36" stroke="#16120F" stroke-width="4"/><text class="b o" font-size="27" x="0" y="10" text-anchor="middle" letter-spacing="0.5" fill="#FFFFFF" stroke="#16120F" stroke-width="5">JAVA</text></g><g transform="translate(505.8 66) rotate(-0.3)"><rect x="-74.5695" y="-21" width="159.139" height="52" rx="10" fill="#16120F"/><rect x="-79.5695" y="-26" width="159.139" height="52" rx="10" fill="#5BC864" stroke="#16120F" stroke-width="4"/><text class="b" font-size="27" x="0" y="10" text-anchor="middle" letter-spacing="0.5" fill="#16120F">SPRING BOOT</text></g><g transform="translate(700.0 66) rotate(2.1)"><rect x="-65.5715" y="-21" width="141.143" height="52" rx="10" fill="#16120F"/><rect x="-70.5715" y="-26" width="141.143" height="52" rx="10" fill="#FFD23F" stroke="#16120F" stroke-width="4"/><text class="b" font-size="27" x="0" y="10" text-anchor="middle" letter-spacing="0.5" fill="#16120F">JAVASCRIPT</text></g><g transform="translate(862.6 66) rotate(1.0)"><rect x="-43.093" y="-21" width="96.186" height="52" rx="10" fill="#16120F"/><rect x="-48.093" y="-26" width="96.186" height="52" rx="10" fill="#2EC4B6" stroke="#16120F" stroke-width="4"/><text class="b" font-size="27" x="0" y="10" text-anchor="middle" letter-spacing="0.5" fill="#16120F">VUE.JS</text></g><g transform="translate(34 126) rotate(-3)"><rect x="0" y="0" width="188.592" height="44" fill="#16120F" stroke="#16120F" stroke-width="3"/><text class="b" font-size="22" x="94.296" y="30" text-anchor="middle" fill="#FFD23F" letter-spacing="1">SIDEKICK SKILLS</text></g><g transform="translate(334.7 148) rotate(-2.0)"><rect x="-48.4255" y="-21" width="106.851" height="52" rx="10" fill="#16120F"/><rect x="-53.4255" y="-26" width="106.851" height="52" rx="10" fill="#2E86DE" stroke="#16120F" stroke-width="4"/><text class="b o" font-size="27" x="0" y="10" text-anchor="middle" letter-spacing="0.5" fill="#FFFFFF" stroke="#16120F" stroke-width="5">PYTHON</text></g><g transform="translate(477.0 148) rotate(0.2)"><rect x="-39.92" y="-21" width="89.84" height="52" rx="10" fill="#16120F"/><rect x="-44.92" y="-26" width="89.84" height="52" rx="10" fill="#8F6BFF" stroke="#16120F" stroke-width="4"/><text class="b o" font-size="27" x="0" y="10" text-anchor="middle" letter-spacing="0.5" fill="#FFFFFF" stroke="#16120F" stroke-width="5">ODOO</text></g><g transform="translate(599.2 148) rotate(-1.4)"><rect x="-28.249000000000002" y="-21" width="66.498" height="52" rx="10" fill="#16120F"/><rect x="-33.249" y="-26" width="66.498" height="52" rx="10" fill="#1C1F3F" stroke="#16120F" stroke-width="4"/><text class="b o" font-size="27" x="0" y="10" text-anchor="middle" letter-spacing="0.5" fill="#FFFFFF" stroke="#16120F" stroke-width="5">C++</text></g><g transform="translate(749.9 148) rot