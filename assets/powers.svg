="b" font-size="27" x="0" y="10" text-anchor="middle" letter-spacing="0.5" fill="#16120F">CANVAS GAMES</text></g><g transform="translate(718.3 296) rotate(1.5)"><rect x="-70.2965" y="-21" width="150.593" height="52" rx="10" fill="#16120F"/><rect x="-75.2965" y="-26" width="150.593" height="52" rx="10" fill="#1C1F3F" stroke="#16120F" stroke-width="4"/><text class="b o" font-size="27" x="0" y="10" text-anchor="middle" letter-spacing="0.5" fill="#FFFFFF" stroke="#16120F" stroke-width="5">POWERSHELL</text></g></svg>
