<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100" role="img" aria-labelledby="title desc"><title id="title">ALL ISSUES</title><desc id="desc">32 public repos</desc><defs><style>@font-face{font-family:KatminBangers;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:KatminHand;src:url(data:font/woff2;base64,) format('woff2')}.b{font-family:KatminBangers,Impact,'Arial Black',sans-serif}.h{font-family:KatminHand,'Comic Sans MS','Chalkboard SE',cursive}
.o{paint-order:stroke;stroke-linejoin:round;stroke-linecap:round}
.spin,.spin-slow,.pulse,.wiggle,.pop-in{transform-box:fill-box;transform-origin:center}
.spin{animation:spin 50s linear infinite}
.spin-slow{animation:spin 120s linear infinite}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.bob{animation:bob 2.6s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.twinkle{animation:twinkle 2.2s ease-in-out infinite}
.steam{animation:steam 2.4s ease-in infinite}
.slide{animation:slide 1.1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.08) rotate(-4deg)}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes steam{0%{transform:translateY(8px);opacity:0}40%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
@keyframes slide{from{transform:translateX(720px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><pattern id="ht" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="5.5" cy="5.5" r="2.4" fill="#16120F"/></pattern></defs><rect x="2" y="2" width="308" height="88" rx="18" fill="#FFFFFF"/><rect x="16" y="16" width="292" height="76" rx="14" fill="#16120F"/><rect x="8" y="8" width="292" height="76" rx="14" fill="#EF3E36" stroke="#16120F" stroke-width="5"/><rect x="8" y="8" width="292" height="76" rx="14" fill="url(#ht)" opacity="0.14"/><g transform="translate(52 46)"><g class="pulse"><polygon points="0,-36.9 7.5,-23 18.9,-26 18.5,-13.5 30.6,-9.9 25,0 29.6,9.6 22.1,16.1 20.5,28.2 8,24.7 0,35.8 -7.5,23.2 -20.9,28.8 -21.7,15.8 -32.5,10.6 -26.2,0 -31.8,-10.3 -20.2,-14.7 -20.9,-28.8 -8.4,-25.8" fill="#FFFFFF" stroke="#16120F" stroke-width="3.5" stroke-linejoin="round"/><text class="b" font-size="38" x="0" y="14" text-anchor="middle" fill="#16120F">#</text></g></g><text class="b o" font-size="34" x="96" y="50" letter-spacing="1.5" fill="#FFFFFF" stroke="#16120F" stroke-width="6">ALL ISSUES</text><text class="h" font-size="19" x="97" y="72" fill="#FFFFFF" opacity="0.9">32 public repos</text></svg>
